<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUPPY Widget</title>
    <style>
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 네모난 위젯 박스 (흰 배경, 노란색 테두리) */
        .widget-container {
            background-color: #ffffff;
            border: 3px solid #FFD700; /* 노란색 테두리 */
            border-radius: 16px;
            padding: 20px;
            width: 240px;
            height: 240px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* 상단 PUPPY 문구 */
        h2 {
            color: #FFA500;
            font-size: 1.3rem;
            margin: 0;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* 화면 가운데 이모티콘 영역 */
        .emoji-display {
            font-size: 3.5rem;
            margin: auto 0;
            transition: transform 0.2s ease;
        }

        /* 이모티콘이 튀어나올 때 애니메이션 효과 */
        .pop {
            transform: scale(1.3);
        }

        /* 하단 노란색 버튼 */
        button {
            background-color: #FFD700; /* 노란 버튼 */
            color: #333333;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            pointer-events: auto; /* 노션 임베드 클릭 최적화 */
        }

        button:hover {
            background-color: #FFC107;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="widget-container">
    <h2>PUPPY</h2>
    <div class="emoji-display" id="emojiBox">🐶</div>
    <button id="puppyBtn">강아지 소환하기</button>
</div>

<script>
    // 다양한 귀여운 강아지 관련 이모티콘 리스트
    const puppies = ["🐶", "🐕", "🦮", "🐕‍🦺", "🐾", "🦴", "✨"];

    const btn = document.getElementById("puppyBtn");
    const emojiBox = document.getElementById("emojiBox");

    function showRandomPuppy() {
        // 무작위 이모티콘 선택
        const randomEmoji = puppies[Math.floor(Math.random() * puppies.length)];
        emojiBox.textContent = randomEmoji;

        // 튀어나오는(Pop) 애니메이션 효과 부여
        emojiBox.classList.remove("pop");
        void emojiBox.offsetWidth; // 리플로우 강제 발생으로 애니메이션 재실행
        emojiBox.classList.add("pop");
    }

    // 노션 환경에서도 확실하게 동작하도록 명시적 이벤트 리스너 추가
    btn.addEventListener("click", showRandomPuppy);
</script>

</body>
</html>
